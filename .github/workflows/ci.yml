name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies and no lockfile, so there is nothing to install.
      # `npm` resolves to the right shim (npm.cmd on Windows) in every shell.
      - name: Tests
        run: npm test
      - name: Check the synthetic clean example
        run: npm run example
      - name: Pack dry run
        run: npm run pack:dry
